<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Classroom Manager</title>
    <link rel="manifest" href="%BASE_URL%manifest.json" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/favicon.svg" />

    <script>
      (function(){
        try {
          var d = localStorage.getItem("classroomDark") === "1";
          if (d) document.documentElement.classList.add("dark", "dark-preload");
          else document.documentElement.classList.remove("dark", "dark-preload");
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
