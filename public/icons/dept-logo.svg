<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100">
  <!-- Punjab Government Emblem -->
  <g transform="translate(10, 6) scale(0.88)">
    <!-- Outer Wreath / Oval Border -->
    <ellipse cx="44" cy="50" rx="40" ry="46" fill="none" stroke="#0B5D45" stroke-width="3.5"/>
    <ellipse cx="44" cy="50" rx="35" ry="41" fill="#F4FBF7" stroke="#0B5D45" stroke-width="1.5"/>
    
    <!-- Crescent & Star -->
    <path d="M 44,14 A 8,8 0 0,0 44,30 A 6.5,6.5 0 0,1 44,17 Z" fill="#0B5D45"/>
    <polygon points="49,19 50.5,22 53.5,22 51,24 52,27 49,25 46,27 47,24 44.5,22 47.5,22" fill="#0B5D45"/>

    <!-- 5 River Waves -->
    <path d="M 18,44 Q 31,39 44,44 T 70,44" fill="none" stroke="#0B5D45" stroke-width="3" stroke-linecap="round"/>
    <path d="M 17,52 Q 31,47 44,52 T 71,52" fill="none" stroke="#0B5D45" stroke-width="3" stroke-linecap="round"/>
    <path d="M 18,60 Q 31,55 44,60 T 70,60" fill="none" stroke="#0B5D45" stroke-width="3" stroke-linecap="round"/>
    <path d="M 21,68 Q 33,63 44,68 T 67,68" fill="none" stroke="#0B5D45" stroke-width="3" stroke-linecap="round"/>
    <path d="M 26,76 Q 35,71 44,76 T 62,76" fill="none" stroke="#0B5D45" stroke-width="3" stroke-linecap="round"/>

    <!-- Bottom Ribbon -->
    <path d="M 12,86 Q 44,95 76,86 L 79,93 Q 44,101 9,93 Z" fill="#0B5D45"/>
    <text x="44" y="93.5" font-family="sans-serif" font-weight="900" font-size="6.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">PUNJAB</text>
  </g>

  <!-- Typography -->
  <text x="106" y="36" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="25" fill="#0B5D45" letter-spacing="-0.3">School Education</text>
  <text x="106" y="62" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="25" fill="#0B5D45" letter-spacing="-0.3">Department Punjab</text>
  <text x="107" y="82" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13.5" fill="#0B5D45" opacity="0.95" letter-spacing="0.1">Quality Education for a Brighter Punjab</text>
</svg>
